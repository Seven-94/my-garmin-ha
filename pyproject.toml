[project]
name = "my-garmin-ha"
authors = [{ name = "Seven-94", email = "64831927+Seven-94@users.noreply.github.com" }]
# Placeholder required by uv. The integration version lives only in
# custom_components/my_garmin/manifest.json.
version = "0.0.0"
# PEP 639 SPDX expression.
license = "MIT"
license-files = ["LICENSE"]
description = "Home Assistant custom integration for the official Garmin Connect Personal API"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
  "ty>=0.0.1a",
  # Sécurité
  "bandit>=1.7.0",
  "detect-secrets>=1.4.0",
  "pip-audit>=2.7.0",
  "prek>=0.3.6",
  "zizmor>=1.22.0",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
  # Provided by Home Assistant at runtime (manifest "requirements" stays empty):
  # needed here only for the tests and the type checker.
  "aiohttp>=3.14.5",
  "pytest-asyncio>=1.4.0",
  "pytest-homeassistant-custom-component>=0.13.375",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration is not an installed package: Home Assistant loads it from
# custom_components/, so the tests import it from the repository root.
pythonpath = ["."]
addopts = "-v --cov --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/my_garmin", "scripts"]
branch = true

[tool.coverage.report]
# pytest fails when total coverage drops below this value.
fail_under = 80

[tool.uv]
# The CI workflow installs exactly the uv version in its `version` input; keep this
# lower bound equal to it. The upper bound refuses a new minor (which may change the
# uv.lock format) until it is raised by hand.
required-version = ">=0.12.10,<0.13"
# Only resolve releases published more than 14 days ago (also accepts "2 weeks"
# or the ISO 8601 form "P14D").
exclude-newer = "14 days"
# Not a distributable Python package: HACS ships custom_components/my_garmin/ as
# is. uv only manages the development environment and does not install the project.
package = false
# Home Assistant depends on the uv Python package, which would put a second,
# newer uv in .venv/bin and break required-version for every `uv run` (hooks,
# CI). The tests never need it: an impossible marker drops it from the lock.
# homeassistant 2026.10.4 pins pillow 12.3.0, which has known vulnerabilities
# fixed in 13.0.0; the integration never uses pillow, so the tests take the fix.
override-dependencies = ["uv; sys_platform == 'never'", "pillow>=13.0.0"]


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"
exclude = [
  # Vendored agent skills: kept identical to their source, so ruff (which also
  # formats Python blocks in Markdown) must not rewrite them.
  ".agents",
  ".git",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ARG", "PTH", "SIM", "C4", "RUF", "N", "BLE", "DTZ", "T20"]
fixable = ["ALL"]

# Ignorer S101 (assert) dans les tests
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
line-ending = "auto"

[tool.bandit]
# B101 (assert) is expected in tests, so tests/ is excluded (aligned with ruff S101).
# Bandit matches each entry as a glob or a substring of the path: keep the
# trailing slash, otherwise a file such as src/pkg/contests.py is silently skipped.
# .venv is listed so that `bandit -r .` does not scan the virtual environment.
exclude_dirs = [".venv", "tests/"]

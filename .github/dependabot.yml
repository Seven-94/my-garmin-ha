version: 2
updates:
  # Python dependencies locked in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same idea as `exclude-newer` in pyproject.toml: skip releases younger than 14 days.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Actions used by the workflows (pinned by commit SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

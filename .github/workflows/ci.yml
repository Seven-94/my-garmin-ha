name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b" # pragma: allowlist secret
          # Off: every run starts clean, with nothing restored from a cache.
          enable-cache: "false"

      - name: Check versions
        run: uv --version

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Run typing checks
        run: uv run ty check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Run zizmor
        run: uv run zizmor --offline .github/workflows/

      - name: Run prek checks
        run: uv run prek run --all-files

      - name: Run prek checks (pre-push stage)
        run: uv run prek run --all-files --stage pre-push

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action pulls the latest hassfest image: the SHA pins the action,
      # not the image, which follows Home Assistant's rules as they change.
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@26d56ed1a1cbfeabf59feb7b26e368e13f47ef52 # master 2024-08-28

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Same as hassfest: the action runs the floating ghcr.io/hacs/action:main image.
      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration
          # A PR comment needs write access: the job reads only.
          comment: "false"
          # No brand icon yet, in the repository or in home-assistant/brands.
          ignore: brands

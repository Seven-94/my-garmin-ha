name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b" # pragma: allowlist secret
          # Off: every run starts clean, with nothing restored from a cache.
          enable-cache: "false"

      - name: Check versions
        run: uv --version

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Run typing checks
        run: uv run ty check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Run zizmor
        run: uv run zizmor --offline .github/workflows/

      - name: Run prek checks
        run: uv run prek run --all-files

      - name: Run prek checks (pre-push stage)
        run: uv run prek run --all-files --stage pre-push
